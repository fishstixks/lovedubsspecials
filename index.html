<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Special Day Awaits</title>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;700;800&family=Wix+Madefor+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#16241b;--mute:#5b695f;--sage:#dbe7d0;--blush:#f8d7d9;--butter:#f9e7a6;--forest:#16301f;--onf:#f3f1e8;--line:rgba(22,36,27,.14);--pill:#16301f;--pillink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1712;--card:#17221b;--ink:#f3f1e8;--mute:#a5b2a8;--sage:#1f3226;--blush:#3b262b;--butter:#3b3620;--forest:#07100a;--onf:#f3f1e8;--line:rgba(255,255,255,.16);--pill:#f3f1e8;--pillink:#0f1712;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1712;--card:#17221b;--ink:#f3f1e8;--mute:#a5b2a8;--sage:#1f3226;--blush:#3b262b;--butter:#3b3620;--forest:#07100a;--onf:#f3f1e8;--line:rgba(255,255,255,.16);--pill:#f3f1e8;--pillink:#0f1712;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 "Wix Madefor Text",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
h1,h2,h3,.disp{font-family:"Wix Madefor Display","Wix Madefor Text",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-weight:700}
.chip{background:var(--sage);border-radius:999px;padding:7px 16px;font-size:.92rem;font-weight:500}
.hero{display:grid;gap:34px;align-items:center;padding:30px 0 64px}
@media (min-width:820px){.hero{grid-template-columns:1.15fr .85fr}}
h1{font-weight:800;font-size:clamp(2.9rem,12vw,5.4rem);line-height:.96;letter-spacing:-.045em;margin:0 0 18px}
.lead{max-width:30ch;color:var(--mute);font-size:1.15rem;margin:0 0 28px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:460px}
.count div{background:var(--sage);border-radius:20px;padding:14px 6px;text-align:center}
.count b{display:block;font-family:"Wix Madefor Display",sans-serif;font-weight:800;font-size:clamp(1.7rem,7vw,2.5rem);line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.count b.tk{animation:tk .4s}@keyframes tk{40%{transform:translateY(-4px)}}
.count span{font-size:.8rem;color:var(--mute)}
.blob{position:relative;background:var(--butter);border-radius:58% 42% 50% 50%/46% 54% 46% 54%;aspect-ratio:1;max-width:380px;width:100%;margin:0 auto;display:grid;place-items:center;animation:morph 9s ease-in-out infinite alternate}
@keyframes morph{to{border-radius:44% 56% 42% 58%/55% 45% 55% 45%}}
.blob .corgi{width:82%}
.fl1,.fl2,.fl3{position:absolute;font-size:2rem;animation:flt 3.2s ease-in-out infinite alternate}
.fl1{top:8%;left:10%}.fl2{top:14%;right:8%;animation-delay:-1s}.fl3{bottom:10%;right:14%;animation-delay:-2s}
@keyframes flt{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(8deg)}}
.corgi{display:block;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.tail{transform-origin:86px 104px;animation:wag .3s ease-in-out infinite alternate}
.ear{transform-origin:36px 30px;animation:ear .6s ease-in-out infinite alternate}
.ear2{transform-origin:84px 30px;animation:ear2 .6s ease-in-out infinite alternate-reverse}
.eye{transform-origin:60px 52px;animation:blink 4.5s infinite}
@keyframes ear2{to{transform:rotate(-5deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes ear{to{transform:rotate(6deg)}}
@keyframes wag{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.mq{background:var(--forest);color:var(--onf);overflow:hidden;white-space:nowrap;padding:14px 0;font-family:"Wix Madefor Display",sans-serif;font-weight:700;font-size:1.3rem}
.mq div{display:inline-block;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
section.s{padding:72px 0 8px}
h2{font-weight:800;font-size:clamp(2rem,7vw,3.2rem);line-height:1;letter-spacing:-.035em;margin:0 0 12px}
.sec-p{color:var(--mute);max-width:46ch;margin:0 0 30px}
.games{display:grid;gap:16px}
@media (min-width:820px){.games{grid-template-columns:repeat(3,1fr)}}
.gc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);border:0;border-radius:32px;padding:26px;min-height:250px;cursor:pointer;transition:transform .25s}
.gc:hover,.gc:focus-visible{transform:translateY(-6px) rotate(-.6deg);outline:none}
.gc:focus-visible{box-shadow:0 0 0 3px var(--ink)}
.gc .em{font-size:3rem;line-height:1;display:inline-block}
.gc:hover .em{animation:wob .6s}
@keyframes wob{30%{transform:rotate(-14deg) scale(1.15)}70%{transform:rotate(12deg) scale(1.15)}}
.gc strong{font-family:"Wix Madefor Display",sans-serif;font-weight:800;font-size:1.5rem;letter-spacing:-.02em;margin:auto 0 4px;display:block;padding-top:22px}
.gc small{font-size:.95rem;color:var(--mute);margin-bottom:16px}
.pl{background:var(--pill);color:var(--pillink);border-radius:999px;padding:8px 20px;font-weight:700;font-size:.92rem}
.c1{background:var(--blush)}.c2{background:var(--sage)}.c3{background:var(--butter)}
.dark{background:var(--forest);color:var(--onf);margin-top:80px;padding:72px 0 64px;border-radius:40px 40px 0 0}
.dark .sec-p{color:rgba(243,241,232,.7)}
.clues{display:grid;gap:14px}
@media (min-width:820px){.clues{grid-template-columns:repeat(3,1fr)}}
.clue{border-radius:28px;padding:24px;background:var(--butter);color:#16241b;min-height:150px}
.clue h3{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px}
.clue p{margin:0;font-size:.98rem}
.clue.locked{background:transparent;border:2px dashed rgba(243,241,232,.35);color:rgba(243,241,232,.7);display:grid;place-items:center;font-size:2rem}
.clue.new{animation:pop .7s}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
footer{background:var(--forest);color:rgba(243,241,232,.7);text-align:center;padding:0 0 36px}
#modal{position:fixed;inset:0;z-index:10;background:rgba(10,20,14,.55);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}#modal.on #box{animation:rise .35s}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
#box{background:var(--bg);color:var(--ink);border-radius:32px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:28px;position:relative}
#x{position:absolute;right:16px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--sage);font-size:1.3rem;line-height:1;color:var(--ink);cursor:pointer}
#box h2{font-size:1.9rem;margin:0 0 14px;padding-right:40px}
.bar{display:flex;justify-content:space-between;font-weight:500;color:var(--mute);margin-bottom:8px;font-variant-numeric:tabular-nums}
.tm{height:8px;background:var(--sage);border-radius:8px;overflow:hidden;margin-bottom:18px}.tm div{height:100%;background:var(--pill);width:100%;border-radius:8px}
.msg{text-align:center;min-height:1.5em;color:var(--mute);margin:12px 0}
.b{font:inherit;font-weight:700;background:var(--pill);color:var(--pillink);border:0;border-radius:999px;padding:12px 26px;cursor:pointer;transition:transform .15s}
.b:hover{transform:scale(1.05)}
.b.alt{background:var(--sage);color:var(--ink)}
.row{display:flex;gap:10px;justify-content:center}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.tiles i{font-style:normal;font-family:"Wix Madefor Display",sans-serif;font-weight:800;font-size:1.3rem;width:38px;height:46px;display:grid;place-items:center;background:var(--blush);border-radius:12px;animation:pop .4s backwards}
input[type=text]{font:inherit;font-weight:700;text-transform:uppercase;text-align:center;letter-spacing:.08em;padding:13px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:260px}
input:focus{outline:3px solid var(--sage);border-color:var(--ink)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.puz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(310px,100%);margin:0 auto}
.puz button{aspect-ratio:1;font:inherit;font-size:2rem;border-radius:22px;border:0;background:var(--sage);color:var(--ink);cursor:pointer;display:grid;place-items:center;line-height:1;transition:transform .12s}
.puz button:nth-child(odd){background:var(--blush)}
.puz button:hover{transform:scale(1.06)}
.puz button small{font-size:.75rem;color:var(--mute);font-weight:700}
.puz button.gap{visibility:hidden}
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(300px,100%);margin:0 auto 18px}
.fl button{aspect-ratio:1;font-size:2.6rem;border-radius:50%;border:0;background:var(--sage);cursor:pointer;transition:transform .1s}
.fl button.lit{transform:scale(1.14);background:var(--butter);box-shadow:0 0 0 4px var(--pill)}
.fl button:disabled{cursor:default}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots u{width:12px;height:12px;border-radius:50%;background:var(--sage);text-decoration:none;transition:background .2s}.dots u.f{background:var(--pill)}
.win{width:110px;margin:0 auto 6px;animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav><span class="disp">Happy Birthday 🐾</span><span class="chip">Clues <b id="cc">0</b> / 3</span></nav>
  <header class="hero">
    <div>
      <h1>A special day awaits.</h1>
      <p class="lead">Your day begins in…</p>
      <div class="count">
        <div><b id="d">00</b><span>days</span></div><div><b id="h">00</b><span>hours</span></div><div><b id="m">00</b><span>mins</span></div><div><b id="s">00</b><span>secs</span></div>
      </div>
    </div>
    <div class="blob" id="hero" aria-hidden="true"><span class="fl1">💄</span><span class="fl2">🌸</span><span class="fl3">🪞</span></div>
  </header>
</div>

<div class="wrap">
  <section class="s">
    <h2>Play to unlock.</h2>
    <p class="sec-p">Win a game to unlock a clue about a stop that hasn’t been revealed yet.</p>
    <div class="games">
      <button class="gc c1" data-g="scramble"><span class="em">💄</span><strong>Word Scramble</strong><small>5 long words in 60 seconds</small><span class="pl">Play</span></button>
      <button class="gc c2" data-g="slide"><span class="em">🐶</span><strong>Slide Puzzle</strong><small>Solve it in 75 seconds</small><span class="pl">Play</span></button>
      <button class="gc c3" data-g="flower"><span class="em">🌸</span><strong>Flower Pattern</strong><small>Remember 14 blooms, then find them after they shift</small><span class="pl">Play</span></button>
    </div>
  </section>
</div>
<section class="dark">
  <div class="wrap">
    <h2>Your clues.</h2>
    <p class="sec-p">Each win reveals one more surprise.</p>
    <div class="clues" id="clues"></div>
  </div>
</section>
<footer><div class="wrap">Made with love 🌿</div></footer>
<div id="modal" role="dialog" aria-modal="true"><div id="box"><button id="x" aria-label="Close">×</button><div id="g"></div></div></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var CORGI='<svg class="corgi" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><ellipse cx="60" cy="113" rx="34" ry="4" fill="#000" opacity=".16"/><g class="tail"><ellipse cx="93" cy="104" rx="8" ry="5.5" fill="#e8964a"/></g><ellipse cx="60" cy="94" rx="31" ry="22" fill="#e8964a"/><path d="M30 90Q32 74 44 72Q38 86 40 104Q31 100 30 90Z" fill="#c97a36" opacity=".35"/><path d="M90 90Q88 74 76 72Q82 86 80 104Q89 100 90 90Z" fill="#c97a36" opacity=".35"/><ellipse cx="60" cy="98" rx="18" ry="19" fill="#fff1dc"/><path d="M45 86Q48.5 93 52 86Q56 93 60 86Q64 93 68 86Q71.5 93 75 86" stroke="#e3c49a" stroke-width="1.3" fill="none" stroke-linecap="round"/><ellipse cx="47" cy="109" rx="9.5" ry="6" fill="#fff1dc"/><ellipse cx="73" cy="109" rx="9.5" ry="6" fill="#fff1dc"/><path d="M44 106v4M49 106v4M71 106v4M76 106v4" stroke="#e0c299" stroke-width="1.4" stroke-linecap="round"/><g class="ear"><path d="M36 30Q16 30 16 54Q16 72 31 67Q42 58 42 40Z" fill="#c97a36"/><path d="M32 38Q23 42 23 54Q24 61 30 59Q35 52 32 38Z" fill="#a8602a" opacity=".6"/></g><g class="ear2"><path d="M84 30Q104 30 104 54Q104 72 89 67Q78 58 78 40Z" fill="#c97a36"/><path d="M88 38Q97 42 97 54Q96 61 90 59Q85 52 88 38Z" fill="#a8602a" opacity=".6"/></g><ellipse cx="60" cy="58" rx="36" ry="31" fill="#e8964a"/><ellipse cx="60" cy="72" rx="28" ry="17" fill="#fff1dc"/><circle cx="35" cy="70" r="8" fill="#fff1dc"/><circle cx="85" cy="70" r="8" fill="#fff1dc"/><path d="M60 27Q69 40 71 58L49 58Q51 40 60 27Z" fill="#fff1dc"/><circle cx="46" cy="43" r="2.6" fill="#fff1dc"/><circle cx="74" cy="43" r="2.6" fill="#fff1dc"/><g class="eye"><ellipse cx="46" cy="52" rx="5" ry="6" fill="#2a211d"/><ellipse cx="74" cy="52" rx="5" ry="6" fill="#2a211d"/><circle cx="47.6" cy="49.8" r="1.9" fill="#fff"/><circle cx="75.6" cy="49.8" r="1.9" fill="#fff"/><circle cx="44.6" cy="54.6" r=".8" fill="#fff"/><circle cx="72.6" cy="54.6" r=".8" fill="#fff"/></g><path d="M52 72Q60 90 68 72Z" fill="#6b2a2f"/><path d="M56 79Q60 87 64 79Q60 76 56 79Z" fill="#e9879a"/><ellipse cx="60" cy="64" rx="6.8" ry="4.8" fill="#2a211d"/><circle cx="57.8" cy="62.3" r="1.4" fill="#fff" opacity=".7"/><path d="M60 68v4M50 70Q55 77 60 72Q65 77 70 70" stroke="#2a211d" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 90Q60 101 75 90" stroke="#3b6ea5" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="60" cy="99" r="4" fill="#e6b94d"/></svg>';
$("#hero").insertAdjacentHTML("beforeend",CORGI);


var CLUES=[
 ["A little house that feels like old Seoul","Vanilla snow melts into something dark and warm. Bring your camera; the walls are made for pictures."],
 ["A hill where ivy has been winning for years","Stone steps climb to a castle that forgot it was a garden. Come before the light turns gold."],
 ["Where the sky turns the color of peaches","Something small and kind is waiting, just for you, while the evening breeze does its work."]
];
var done={};
try{done=JSON.parse(localStorage.getItem("adv-done")||"{}")||{}}catch(e){done={}}
function save(){try{localStorage.setItem("adv-done",JSON.stringify(done))}catch(e){}}
function nDone(){return Object.keys(done).filter(function(k){return done[k]}).length}
function renderClues(){
  var n=nDone();$("#cc").textContent=n;
  var h="";
  for(var i=0;i<3;i++){h+=i<n?'<div class="clue"><h3>'+CLUES[i][0]+'</h3><p>'+CLUES[i][1]+'</p></div>':'<div class="clue locked" aria-label="Locked clue">🔒</div>'}
  $("#clues").innerHTML=h;
  document.querySelectorAll(".gc").forEach(function(b){b.querySelector(".pl").textContent=done[b.dataset.g]?"Done ✓ Play again":"Play"});
}
renderClues();
var T0=new Date("2026-11-06T14:00:00+08:00").getTime();
function p(n){return String(n).padStart(2,"0")}
var prev={};
function set(id,v){var e=$("#"+id);if(prev[id]!==v){e.textContent=v;if(prev[id]!==undefined){e.classList.remove("tk");void e.offsetWidth;e.classList.add("tk")}prev[id]=v}}
function tick(){var t=Math.max(0,T0-Date.now())/1000;
  set("d",p(Math.floor(t/86400)));set("h",p(Math.floor(t%86400/3600)));set("m",p(Math.floor(t%3600/60)));set("s",p(Math.floor(t%60)))}
tick();setInterval(tick,1000);
var timers=[];
function later(f,ms){var id=setTimeout(f,ms);timers.push(id);return id}
function every(f,ms){var id=setInterval(f,ms);timers.push(id);return id}
function clearAll(){timers.forEach(function(i){clearTimeout(i);clearInterval(i)});timers=[]}
function closeM(){clearAll();$("#modal").classList.remove("on")}
$("#x").onclick=closeM;
$("#modal").addEventListener("click",function(e){if(e.target===this)closeM()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
function open(name){clearAll();$("#modal").classList.add("on");G[name]()}
document.querySelectorAll(".gc").forEach(function(b){b.onclick=function(){open(b.dataset.g)}});
function finish(name,won,text){
  clearAll();
  var wasNew=won&&!done[name];
  if(won){done[name]=true;save();renderClues()}
  var n=nDone(),c=wasNew?CLUES[n-1]:null;
  $("#g").innerHTML=(won?'<div class="win">'+CORGI+'</div>':'')+'<h2 style="text-align:center;padding:0">'+(won?"You did it!":"Not quite.")+'</h2><p class="msg">'+text+'</p>'+
   (c?'<div class="clue new"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>':'')+
   '<div class="row" style="margin-top:18px">'+(won?'':'<button class="b" id="again">Try again</button>')+'<button class="b alt" id="fin">Close</button></div>';
  $("#fin").onclick=closeM;
  if(!won)$("#again").onclick=function(){open(name)};
}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var G={};
G.scramble=function(){
  var W=shuf(["LIPSTICK","EYESHADOW","HIGHLIGHTER","FOUNDATION","STRAWBERRY","WILDFLOWER","BUTTERFLIES","MUSHROOMS"]).slice(0,5);
  var i=0,left=60;
  function scr(w){var s;do{s=shuf(w.split("")).join("")}while(s===w);return s}
  var cw=scr(W[0]);
  function draw(){
    $("#g").innerHTML='<h2>Word Scramble</h2><div class="bar"><span>Word '+(i+1)+' of 5</span><span id="t">'+left+'s</span></div><div class="tm"><div id="tb" style="width:'+left/60*100+'%"></div></div>'+
     '<div class="tiles">'+cw.split("").map(function(c,k){return'<i style="animation-delay:'+k*40+'ms">'+c+"</i>"}).join("")+'</div>'+
     '<div class="row"><input type="text" id="in" autocomplete="off" autocapitalize="characters" aria-label="Your answer"></div><p class="msg" id="ms">Unscramble the word.</p><div class="row"><button class="b" id="ok">Check</button></div>';
    var inp=$("#in");inp.focus();
    function go(){
      if(inp.value.trim().toUpperCase()===W[i]){i++;if(i===5){finish("scramble",true,"All five words found with "+left+" seconds left.");return}cw=scr(W[i]);draw()}
      else{inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");$("#ms").textContent="Not that one. Try again."}
    }
    $("#ok").onclick=go;inp.onkeydown=function(e){if(e.key==="Enter")go()};
  }
  draw();
  every(function(){left--;var t=$("#t");if(t){t.textContent=left+"s";$("#tb").style.width=left/60*100+"%"}if(left<=0)finish("scramble",false,"Time ran out.")},1000);
};
G.slide=function(){
  var ic=["🐶","💄","🌸","🪞","🍓","🌼","🐾","🦋"];
  var a=[1,2,3,4,5,6,7,8,0],last=-1,left=75;
  for(var k=0;k<90;k++){
    var z=a.indexOf(0),r=Math.floor(z/3),c=z%3,nb=[];
    if(r>0)nb.push(z-3);if(r<2)nb.push(z+3);if(c>0)nb.push(z-1);if(c<2)nb.push(z+1);
    nb=nb.filter(function(x){return x!==last});var m=nb[Math.floor(Math.random()*nb.length)];
    a[z]=a[m];a[m]=0;last=z;
  }
  function solved(){for(var i=0;i<8;i++)if(a[i]!==i+1)return false;return true}
  function draw(){
    $("#g").innerHTML='<h2>Slide Puzzle</h2><div class="bar"><span>Put the tiles in order</span><span id="t">'+left+'s</span></div><div class="tm"><div id="tb" style="width:'+left/75*100+'%"></div></div><div class="puz">'+
     a.map(function(v,i){return v?'<button data-i="'+i+'">'+ic[v-1]+'<small>'+v+'</small></button>':'<button class="gap" disabled></button>'}).join("")+'</div>';
    document.querySelectorAll(".puz button[data-i]").forEach(function(b){b.onclick=function(){
      var i=+b.dataset.i,z=a.indexOf(0);
      if((Math.abs(i-z)===3)||(Math.abs(i-z)===1&&Math.floor(i/3)===Math.floor(z/3))){a[z]=a[i];a[i]=0;if(solved())finish("slide",true,"Solved with "+left+" seconds left.");else draw()}
    }});
  }
  draw();
  every(function(){left--;var t=$("#t");if(t){t.textContent=left+"s";$("#tb").style.width=left/75*100+"%"}if(left<=0)finish("slide",false,"Time ran out.")},1000);
};
G.flower=function(){
  var F=["🌸","🌻","🌷","🌹","🌼","🌺"],N=14,seq=[],pos=[0,1,2,3,4,5],step=0,live=false,tmo=null;
  for(var i=0;i<N;i++){var r;do{r=Math.floor(Math.random()*6)}while(i>0&&r===seq[i-1]);seq.push(r)}
  function board(){
    $("#g").innerHTML='<h2>Flower Pattern</h2><div class="dots">'+seq.map(function(_,i){return'<u class="'+(i<step?"f":"")+'"></u>'}).join("")+'</div><p class="msg" id="ms"></p>'+
     '<div class="fl">'+pos.map(function(f,i){return'<button data-i="'+i+'" disabled aria-label="flower">'+F[f]+'</button>'}).join("")+'</div><div class="tm"><div id="tb" style="width:0"></div></div><p class="msg">One mistake restarts the round.</p>';
  }
  function say(t){var m=$("#ms");if(m)m.textContent=t}
  function show(){
    live=false;step=0;board();say("Watch closely.");
    var i=0;
    function next(){
      if(i>=N){later(function(){say("The flowers are shifting.");later(function(){pos=shuf(pos);board();say("Repeat the order. 4 seconds per flower.");arm()},700)},500);return}
      var ms=Math.max(340,620-i*20),idx=pos.indexOf(seq[i]),b=document.querySelectorAll(".fl button")[idx];
      b.classList.add("lit");
      later(function(){b.classList.remove("lit");i++;later(next,110)},ms);
    }
    later(next,900);
  }
  function arm(){
    live=true;
    document.querySelectorAll(".fl button").forEach(function(b){b.disabled=false;b.onclick=function(){pick(+b.dataset.i)}});
    timeLeft();
  }
  function timeLeft(){
    clearTimeout(tmo);var tb=$("#tb");
    if(tb){tb.style.transition="none";tb.style.width="100%";void tb.offsetWidth;tb.style.transition="width 4s linear";tb.style.width="0"}
    tmo=later(function(){if(live)lose("Too slow.")},4000);
  }
  function lose(why){live=false;clearTimeout(tmo);finish("flower",false,why+" The pattern restarts with a new order.")}
  function pick(i){
    if(!live)return;
    if(pos[i]===seq[step]){
      step++;
      if(step===N){live=false;clearTimeout(tmo);finish("flower",true,"All 14 flowers, in order.");return}
      var d=document.querySelectorAll(".dots u");for(var k=0;k<step;k++)d[k].className="f";
      timeLeft();
    }else lose("Wrong flower.");
  }
  show();
};
})();
</script>
